# Render Blueprint: Render reads this file and sets up the bot automatically.
services:
  - type: web
    name: rps-parts-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_MODE
        value: free
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1390795964111758"
      - key: WHATSAPP_VERIFY_TOKEN
        value: rps-verify-123
      - key: GRAPH_API_VERSION
        value: v26.0
      - key: SHOPIFY_STORE
        value: rpsstorenew.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: PUBLIC_STORE_URL
        value: https://rpsdistributorsinc.com
      - key: BUSINESS_CONTACT
        value: email sales@rpsdistributorsinc.com or call our office
      # Secrets - Render will ask you to paste these:
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: ALLOWED_NUMBERS        # your WhatsApp number(s), digits only, e.g. 1848...
        sync: false
